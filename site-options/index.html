<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site options</title>
<link rel="icon" type="image/svg+xml" href="../site/icon.svg">
<style>
:root {
  --ink: #141925; --panel: #1B2131; --line: #2E3850; --text: #E7EAF1; --muted: #8B94AB; --accent: #F0B64A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
header { padding: 32px 16px 8px; max-width: 1400px; margin: 0 auto; }
h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 20px; padding: 20px 16px 48px; max-width: 1400px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.frame { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #0e121b; border-bottom: 1px solid var(--line); }
/* Render each page at 1440 wide, scaled to the card. */
.frame iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 { margin: 0; font-size: 17px; }
.num { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 6px; }
.body p { margin: 0; color: var(--muted); }
.rec { font-size: 12px; color: var(--ink); background: var(--accent); border-radius: 999px; padding: 2px 9px; font-weight: 600; white-space: nowrap; }
.actions { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; }
a.btn { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 600; }
a.btn.primary { background: var(--accent); border-color: var(--accent); color: #1b1406; }
a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pending { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Download page: 5 options</h1>
  <p>Live previews, scaled down. Open one to see it full size, scroll through it, and try a phone-width window too.</p>
</header>
<main id="grid"></main>
<script>
const options = [
  { slug: 'darkroom', name: 'Darkroom', line: 'Recovered files develop like prints in a tray under a safelight, then get a grease-pencil label. Same look as the app.' },
  { slug: 'hexdump', name: 'Magic bytes', line: 'A live hex viewer streams cache bytes; when a file signature passes, it decodes into a named, dated card.', rec: true },
  { slug: 'eviction', name: 'Before it’s evicted', line: 'Media drifts toward the edge of the cache and the app catches it just before Discord throws it away.' },
  { slug: 'lostfound', name: 'Lost & found', line: 'A split-flap departures board and baggage carousel full of tagged, recovered files.' },
  { slug: 'blueprint', name: 'The index walk', line: 'An animated technical drawing: a scan head walks a cache entry and pulls out the link, date and type.' },
];
const grid = document.getElementById('grid');
options.forEach((o, i) => {
  const url = `./${o.slug}/`;
  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = `
    <div class="frame"><div class="pending">Not ready yet</div></div>
    <div class="body">
      <div class="top"><h2><span class="num">${i + 1}</span>${o.name}</h2>${o.rec ? '<span class="rec">Recommended</span>' : ''}</div>
      <p>${o.line}</p>
      <div class="actions"><a class="btn primary" href="${url}" target="_blank" rel="noopener">Open full size</a></div>
    </div>`;
  grid.append(card);
  // Only embed pages that exist, so unfinished options show a placeholder.
  fetch(`${url}index.html`, { method: 'HEAD' }).then((r) => {
    if (!r.ok) return;
    const frame = card.querySelector('.frame');
    frame.innerHTML = '';
    const f = document.createElement('iframe');
    f.src = url;
    f.title = `${o.name} preview`;
    f.loading = 'lazy';
    f.tabIndex = -1;
    frame.append(f);
    const fit = () => (f.style.transform = `scale(${frame.clientWidth / 1440})`);
    new ResizeObserver(fit).observe(frame);
  });
});
</script>
</body>
</html>
