[package]
name = "discord-cache-recovery"
version = "4.0.0"
description = "Recover media from Discord's local HTTP cache"
authors = ["Azmek"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "discord_cache_recovery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
url = "2"
percent-encoding = "2"
httpdate = "1"
filetime = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
